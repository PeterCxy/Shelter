apply plugin: 'com.android.application'

def getVersionCode = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--first-parent', '--count', 'HEAD'
            standardOutput = stdout
        }
        return Integer.parseInt(stdout.toString().trim())
    }
    catch (ignored) {
        return 1
    }
}

def getVersionName = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--dirty'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    }
    catch (ignored) {
        return "1.0-dev"
    }
}

android {
    compileSdk 37
    buildToolsVersion = '37.0.0'
    defaultConfig {
        applicationId "net.typeblog.shelter"
        minSdkVersion 26
        targetSdkVersion 37
        versionCode getVersionCode()
        versionName getVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        if (variant.name == "debug") {
            variant.outputs.each { o -> o.versionCodeOverride = System.currentTimeSeconds() }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        disable 'MissingTranslation', 'ExtraTranslation', 'GoogleAppIndexingWarning', 'InvalidFragmentVersionForActivityResult'
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    namespace 'net.typeblog.shelter'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.0'
}

// Sanitize AIDL compiler output on Windows to prevent javac illegal unicode escape errors
tasks.matching { it.name.startsWith("compile") && it.name.endsWith("Aidl") }.configureEach { aidlTask ->
    aidlTask.doLast {
        def outDir = aidlTask.sourceOutputDir.get().asFile
        if (outDir.exists()) {
            outDir.eachFileRecurse { File f ->
                if (f.name.endsWith(".java")) {
                    def lines = f.readLines()
                    boolean modified = false
                    def newLines = lines.collect { line ->
                        if (line.trim().startsWith("* Using:")) {
                            modified = true
                            return line.replace('\\', '/')
                        }
                        return line
                    }
                    if (modified) {
                        f.text = newLines.join("\n")
                    }
                }
            }
        }
    }
}
